<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: black;">
  <script src="function.js"></script>
<div class='divbox'>
  <p class="display-styl js-display"></p>
  <p> 
    <button class="gray_button" onclick=" update('1'); ">1</button>
    <button class="gray_button" onclick=" update('2'); ">2</button>
    <button class="gray_button" onclick=" update('3'); ">3</button>
    <button class="orange-button" onclick=" update('+'); ">+</button>
  </p>
  <p>
    <button class="gray_button" onclick=" update('4'); ">4</button>
    <button class="gray_button" onclick=" update('5'); ">5</button>

    <button class="orange-button" onclick=" update('-'); ">-</button>
  </p>
  <p>
    <button class="gray_button" onclick=" update('7'); ">7</button>
    <button class="gray_button" onclick=" update('8'); ">8</button>
    <button class="gray_button" onclick=" update('9'); ">9</button>
    <button class="orange-button" onclick=" update('*'); ">*</button>
  </p>
  <p>
    <button class="gray_button" onclick=" update('.'); ">.</button>
    <button class="gray_button" onclick=" update('0'); ">0</button>
    <button class="gray_button" onclick=" update('=')  ">=</button>
    <button class="orange-button" onclick=" update('/'); ">/</button>
  </p>
  <button class="clear" onclick=" calculation = ' '; display(); " >clear</button>
